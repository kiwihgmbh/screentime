# Read by docker-java, which Testcontainers uses to reach the Docker daemon.
#
# docker-java still negotiates API version 1.32 by default. Docker Engine 29
# refuses every version below 1.41 with HTTP 400, which Testcontainers reports
# as "Could not find a valid Docker environment" even though the socket is
# fine. Pinning 1.43 (Docker 24, 2023) works with every engine since then.
api.version=1.43
