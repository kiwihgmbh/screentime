# The frontend container: the built Angular app, and one door for the whole
# application.
#
# /api goes to the backend over the compose network, so the browser only ever
# talks to one origin. That means no CORS in a normal deployment, and one
# hostname and one certificate to look after.

# Values an outer reverse proxy may already have set, defaulting to this
# request when it has not. These are map directives, which belong to the http
# block; files in conf.d are included there, so this is the right place.
#
# $host drops the port. The application compares the browser's Origin against
# the host it believes it was addressed on, so a Host header without the port
# makes a same origin request look cross origin and sign in stops working.
# $http_host keeps the port exactly as the client sent it.
map $http_x_forwarded_proto $forwarded_proto {
    ''      $scheme;
    default $http_x_forwarded_proto;
}

map $http_x_forwarded_host $forwarded_host {
    ''      $http_host;
    default $http_x_forwarded_host;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # the app is used on a phone over mobile data often enough to care
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    client_max_body_size 1m;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://screentime-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;

        # Spring Security sends these two as well. A duplicated framing header
        # can be ignored outright by a browser, so the upstream copies are
        # dropped and the ones above are the only source.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        # Cache-Control is left to Spring Security, which already sends
        # no-store on every API response
    }

    # health of the frontend container itself
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The build gives every asset a content hash in its name, so these can be
    # cached hard. One Cache-Control only, set here rather than with `expires`,
    # which would add a second one.
    location ~* \.(?:js|css|woff2?|png|svg|ico|jpg|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy never reaches the iPad.
    # `location /` reaches this through its try_files, so this is where the
    # headers for a page load are actually decided.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # an Angular route is not a file, so unknown paths get the app
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
