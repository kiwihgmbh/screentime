# Included by every location that sets a header of its own.
#
# nginx does not merge add_header directives down the tree: a location that
# declares one replaces every inherited one. Declaring these at server level
# only would silently drop them from exactly the responses that matter, so
# each location includes this file instead.

# this app shows one family's screen time; it has no business being framed or
# sniffed, and it never needs to be indexed
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
